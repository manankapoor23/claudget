appId: com.claudget.app
productName: claudget
copyright: Copyright © 2026 claudget contributors

# Pinned because npm workspaces hoist `electron` to the root node_modules, where
# electron-builder's auto-detection can't find it. Keep in sync with the electron devDep.
electronVersion: 42.4.1

# The UI is English-only.
#
# This does the whole job on Windows and Linux — electron-builder reduces
# locales/ to exactly this list while copying the framework, before afterPack
# runs. On macOS it only prunes the small app-level *.lproj stubs and leaves the
# ~47 MB of locale.pak inside Electron Framework.framework, which is why the
# afterPack hook below exists.
#
# Keep this list and KEEP in build/after-pack.js in agreement, or a locale will
# survive on one platform and not the others.
electronLanguages:
  - en-US

afterPack: build/after-pack.js

# Smaller installers. Build-time cost only — installed size is unchanged.
compression: maximum

# Free distribution, no paid certs. Releases are published to GitHub Releases.
publish:
  provider: github
  owner: manankapoor23
  repo: claudget

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  # Source maps are a build artefact; users don't need them installed.
  - '!out/**/*.map'
  - package.json

extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'

# Don't pull the whole symlinked workspace into the asar — core is bundled.
removePackageScripts: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: claudget
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-Portable-${arch}.${ext}

dmg:
  # Pin the arch into every filename. Left to its default, electron-builder omits
  # the suffix for x64 — the three builds came out as "-universal.dmg",
  # "-arm64.dmg" and plain ".dmg", and the website reads the arch from the
  # filename, so the x64 build would have been served as the universal one.
  artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  target:
    # Three artifacts on purpose. A universal build carries both slices, so it
    # is ~190 MB larger on disk than the arch the machine will actually execute
    # — but it is the only download that is always correct, and Safari reports
    # Apple Silicon Macs as "Intel Mac OS X", so the site cannot always tell.
    # So: universal stays the safe default, and the per-arch builds let anyone
    # we can positively identify take the half-size download instead.
    - target: dmg
      arch: [universal, arm64, x64]
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Ad-hoc signed, as the whole bundle (no paid Apple cert, so no notarization:
  # users still clear Gatekeeper quarantine once on first open, with
  # right-click → Open or `xattr -cr "/Applications/claudget.app"`).
  #
  # This used to be `identity: null`, which skips signing altogether. The app
  # then kept only the linker's ad-hoc signature on the main executable, still
  # named "Electron", with Info.plist unbound and no sealed resources, so
  # `codesign --verify` failed. macOS's notification daemon checks that an
  # app's signing identifier matches its bundle ID; "Electron" posting for
  # com.claudget.app was refused (UNErrorDomain error 1), so no limit alert
  # ever reached Notification Center. "-" signs the bundle properly (identifier
  # com.claudget.app, from Info.plist), after afterPack has pruned locales and,
  # for the universal build, after the two arches are merged.
  identity: '-'
  # The hardened runtime only matters for notarization, and ad-hoc signed code
  # under it fails library validation unless an entitlement turns that off.
  hardenedRuntime: false
  # Native helpers in Contents/Resources that sign themselves at build time
  # (claudget-notch, from the Notch line) keep their own signature and
  # identifier; the app's seal still covers them as resources. A no-op until
  # such a helper exists.
  signIgnore:
    - 'Contents/Resources/claudget-notch$'
  notarize: false

# AppImage runtime. The default (legacy) runtime needs libfuse2, which Ubuntu
# 22.04+ and Fedora no longer install, so the AppImage failed with "AppImages
# require FUSE to run" on a fresh system. The static runtime carries its own
# FUSE support. Its launcher (AppRun) also probes `unshare -Ur true` and passes
# --no-sandbox to Electron only when unprivileged user namespaces are
# unavailable — Ubuntu 23.10+ restricts them through AppArmor for programs
# without a profile, which an AppImage can't install, and Chromium then aborts
# ("The SUID sandbox helper binary was found, but is not configured
# correctly"). Everywhere user namespaces work, the sandbox stays on.
toolsets:
  appimage: '1.0.3'

linux:
  target:
    - AppImage
    # The .deb installs an AppArmor profile that allows user namespaces (Ubuntu
    # 24.04+), or a setuid chrome-sandbox on kernels without them, so it keeps
    # Chromium's sandbox where the AppImage has to turn it off.
    - deb
  category: Utility
  icon: build/icon.png
  maintainer: Claude Widget contributors
  # Left unset, Linux names the binary after the npm package, so the AppImage's
  # executable, .desktop file and icon all came out as "@claude-widgetdesktop".
  executableName: claudget
  # No compression override here any more: the AppImage catalog
  # (appimage.github.io) mounts AppImages with a squashfuse that reads only
  # zlib and zstd, and the static runtime always builds zstd (it can't read
  # xz), while a Linux-wide `normal` would reach the .deb, where fpm rejects it.

deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
  synopsis: Claude Code usage limits in your system tray
