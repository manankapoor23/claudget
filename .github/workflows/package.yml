name: Package

# Builds the real installers on all three OSes, exactly as release.yml does,
# but never publishes. Use it to try a release before tagging; the installers
# are kept as workflow artifacts for a few days.
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/package.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:core
      - run: npm run build -w @claude-widget/desktop

      - name: Package (no publish)
        working-directory: packages/desktop
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # don't hunt for a signing cert

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          retention-days: 5
          if-no-files-found: error
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.yml
