name: Package

# Builds the real installers on all three OSes, exactly as release.yml does,
# but never publishes. Use it to try a release before tagging; the installers
# are kept as workflow artifacts for a few days.
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/package.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:core
      - run: npm run build -w @claude-widget/desktop

      # The Notch line's native helper: universal (arm64 + x86_64), ad-hoc
      # signed. Fails loudly if swiftc is missing rather than shipping without it.
      - name: Build notch helper (macOS)
        if: runner.os == 'macOS'
        run: npm run build:notch -w @claude-widget/desktop

      - name: Package (no publish)
        working-directory: packages/desktop
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # don't hunt for a signing cert
          # electron-builder skips all signing on pull-request builds unless
          # told otherwise. The mac build is ad-hoc signed (identity "-"),
          # which uses no secrets, and an unsigned app can't post notifications.
          CSC_FOR_PULL_REQUEST: 'true'

      # Every mac app must be signed as a whole bundle under its own ID, or
      # macOS silently drops its notifications.
      - name: Check the mac apps' signatures (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: scripts/check-mac-signature.sh release/mac*/claudget.app

      - name: Check the notch helper is packed (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          for app in release/mac*/claudget.app; do
            bin="$app/Contents/Resources/claudget-notch"
            test -x "$bin" || { echo "missing: $bin"; exit 1; }
            lipo -info "$bin"
            codesign -dv "$bin"
            "$bin" --version
          done
          for dmg in release/*.dmg; do
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            test -x "$mnt/claudget.app/Contents/Resources/claudget-notch" \
              && echo "ok: $dmg contains the notch helper" \
              || { hdiutil detach "$mnt" >/dev/null; echo "missing in $dmg"; exit 1; }
            hdiutil detach "$mnt" >/dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          retention-days: 5
          if-no-files-found: error
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/latest*.yml
