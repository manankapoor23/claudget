name: Release

# Push a version tag to build installers for all three OSes and publish them
# to a GitHub Release. No paid certs — macOS builds are ad-hoc signed, not notarized.
#
#   npm version patch        # bumps package.json + creates the tag
#   git push --follow-tags   # triggers this workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bundle core, then build the Electron main/preload/renderer into out/.
      - run: npm run build:core
      - run: npm run build -w @claude-widget/desktop

      # The Notch line's native helper: universal (arm64 + x86_64), ad-hoc
      # signed. Fails loudly if swiftc is missing rather than shipping without it.
      - name: Build notch helper (macOS)
        if: runner.os == 'macOS'
        run: npm run build:notch -w @claude-widget/desktop

      # Package + publish. electron-builder reads packages/desktop/electron-builder.yml
      # and uploads to the GitHub Release for this tag.
      - name: Package and publish
        working-directory: packages/desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # don't hunt for a signing cert

      # Every mac app must be signed as a whole bundle under its own ID, or
      # macOS silently drops its notifications. Fails the run (after upload,
      # so check the Package workflow before tagging).
      - name: Check the mac apps' signatures (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: scripts/check-mac-signature.sh release/mac*/claudget.app
